<!DOCTYPE html>
<html>
<head>
    <title>NX-STRIKE | Ghost Shield V7 (HYPER-VM)</title>
    <style>
        body { background: #020202; color: #00ff00; font-family: 'Consolas', monospace; padding: 30px; text-align: center; }
        .container { max-width: 850px; margin: auto; background: #050505; border: 1px solid #00ff00; padding: 25px; border-radius: 2px; box-shadow: 0 0 30px rgba(0, 255, 0, 0.1); }
        textarea { width: 100%; height: 200px; background: #000; color: #00ff00; border: 1px solid #00ff0044; padding: 15px; font-size: 11px; outline: none; margin-bottom: 20px; box-sizing: border-box; }
        .btn { background: #00ff00; color: #000; border: none; padding: 18px; width: 100%; font-weight: 900; cursor: pointer; letter-spacing: 5px; transition: 0.3s; margin-bottom: 10px; }
        .btn:hover { background: #fff; box-shadow: 0 0 20px #00ff00; }
        .copy-btn { background: #111; color: #00ff00; border: 1px solid #00ff00; padding: 10px; width: 100%; font-size: 10px; letter-spacing: 2px; cursor: pointer; transition: 0.2s; }
        .copy-btn:hover { background: #00ff00; color: #000; }
        .status { font-size: 10px; color: #444; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="letter-spacing: 10px; margin-bottom: 5px;">NX-STRIKE V7</h1>
    <p style="color:#00ff00; font-size:10px; margin-bottom: 25px; opacity: 0.6;">CUSTOM OP-CODE VIRTUALIZATION ENGINE | CONTROL FLOW FLATTENING</p>
    
    <textarea id="input" placeholder="[ PASTE RAW SOURCE CODE HERE ]"></textarea>
    
    <button class="btn" onclick="strike()">STRIKE & PROTECT (HYPER-VM)</button>
    
    <div style="margin-top: 25px;">
        <label style="display:block; font-size:10px; color:#666; margin-bottom:5px;">VIRTUALIZED EXECUTION BLOCK</label>
        <textarea id="output" readonly placeholder="[ VIRTUAL MACHINE MATRIX WILL APPEAR HERE ]"></textarea>
        <button class="copy-btn" id="copyBtn" onclick="copyToClipboard()">COPY MATRIX TO CLIPBOARD</button>
    </div>
    
    <p class="status" id="statusLabel">SYSTEM READY</p>
</div>

<script>
function strike() {
    const src = document.getElementById('input').value;
    if(!src) { alert("Input required."); return; }

    // --- GENERATE RANDOM VIRTUAL OPCODES ---
    // Instead of fixed structures, instructions map to completely randomized IDs each compile.
    const opcodes = {
        LOAD_CONST: Math.floor(Math.random() * 50) + 1,
        CALL_GLOBAL: Math.floor(Math.random() * 50) + 51,
        EXECUTE: Math.floor(Math.random() * 50) + 101,
        TERMINATE: 0
    };

    const xorMaster = Math.floor(Math.random() * 120) + 20;
    const dynamicSalt = Math.floor(Math.random() * 15) + 5;

    // --- TOKENS & STRING HANDLING MATRIX ---
    // Split the script into unique chunks to simulate real byte-code registers
    let serializedByteStream = [];
    for (let i = 0; i < src.length; i++) {
        let b = src.charCodeAt(i);
        let dynamicCipher = (b ^ xorMaster) + (i % dynamicSalt);
        serializedByteStream.push(dynamicCipher);
    }

    // Assemble the fake compiled byte program array
    // Struct format: [OP_CODE, ARG_1, ARG_2, ...]
    let bytecodeProgram = [
        opcodes.LOAD_CONST, 1, 0,       // Instruction 1: Prepare data stream register
        opcodes.CALL_GLOBAL, 22, 105,   // Instruction 2: Isolate environment mappings
        opcodes.EXECUTE, 99, 1,         // Instruction 3: Spin virtualization processor
        opcodes.TERMINATE, 0, 0         // Instruction 4: Flush register arrays
    ];

    // --- MULTI-STAGE VM TEMPLATE ---
    const loader = `--[[ NX-STRIKE PRIVATE INDUSTRIAL VM LAYER ]]
local _virtualStream = {${serializedByteStream.join(',')}}
local _byteProgram = {${bytecodeProgram.join(',')}}
local _mX, _dS = ${xorMaster}, ${dynamicSalt}

-- Native library cache allocation
local _bx = bit32.bxor
local _sc = string.char
local _tc = table.concat

-- VM Architecture Environment Initialization
local _Registers = { [1] = {}, [2] = nil, [3] = 0 }
local _IP = 1 -- Instruction Pointer

-- Structural Flattening Routine (Breaks down execution pathways into isolated states)
local _Dispatcher = {
    [${opcodes.LOAD_CONST}] = function()
        -- Rebuild the target payload dynamically within a sandboxed virtual register
        for i = 1, #_virtualStream do
            local raw = _virtualStream[i]
            local realKey = raw - ( (i - 1) % _dS )
            _Registers[1][i] = _sc(_bx(realKey, _mX))
        end
        _IP = _IP + 3
    end,
    
    [${opcodes.CALL_GLOBAL}] = function()
        -- Dynamic lookup via protected memory pointer references
        local envLookup = getfenv(0)
        local rawTarget = string.reverse("gnirtsdaol")
        _Registers[2] = envLookup[rawTarget]
        _IP = _IP + 3
    end,
    
    [${opcodes.EXECUTE}] = function()
        -- Run the virtualized memory thread inside decoupled execution space
        local memoryStream = _tc(_Registers[1])
        local runner, err = _Registers[2](memoryStream)
        if runner then
            task.spawn(runner)
        else
            error("[NX-STRIKE MATRIX CORRUPTION]")
        end
        _IP = _IP + 3
    end,
    
    [${opcodes.TERMINATE}] = function()
        -- Instantly destroy tracking objects to prevent memory-dump extraction
        _Registers = nil
        _IP = 0
    end
}

-- The Master Control Flow Loop (The Flattened Core Engine)
while _IP > 0 and _IP <= #_byteProgram do
    local currentOpcode = _byteProgram[_IP]
    local targetHandler = _Dispatcher[currentOpcode]
    
    if targetHandler then
        targetHandler() -- Execute the mapped instruction block
    else
        _IP = 0 -- Trap encountered; immediately kill program pipeline
    end
end`;

    document.getElementById('output').value = loader;
    document.getElementById('statusLabel').innerText = "CRITICAL METAMORPHIC MATRIX ARMED";
}

function copyToClipboard() {
    const output = document.getElementById('output');
    const btn = document.getElementById('copyBtn');
    if (!output.value) return;
    output.select();
    navigator.clipboard.writeText(output.value).then(() => {
        btn.innerText = "COPIED ENGINE CONFIG!";
        setTimeout(() => { btn.innerText = "COPY MATRIX TO CLIPBOARD"; }, 2000);
    });
}
</script>

</body>
</html>
